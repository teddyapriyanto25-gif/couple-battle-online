<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Couple Battle Online</title><link rel="stylesheet" href="/style.css"></head><body><main>
<section id="home" class="screen active"><div class="logo">⚔️❤️</div><h1>COUPLE BATTLE</h1><p>DUEL • RACE • PLAY TOGETHER</p><input id="name" maxlength="20" placeholder="Nama kamu"><div class="row"><button id="create" class="primary">➕ BUAT ROOM</button><button id="showJoin">🚪 GABUNG</button></div><div id="join" class="hidden"><input id="code" maxlength="4" placeholder="KODE ROOM"><button id="joinBtn" class="primary">GABUNG ROOM</button></div><div id="conn" class="pill">🟡 Menghubungkan...</div></section>
<section id="lobby" class="screen"><button id="homeBtn">← Kembali</button><h2>ROOM <span id="roomCode"></span></h2><p>Bagikan kode ke pasangan ❤️</p><div id="bigCode" class="bigcode">----</div><div id="players" class="players"></div><h3>PILIH GAME</h3><div class="games"><button data-g="Couple Fighter">🥊<b>Couple Fighter</b><small>Fighting 2D</small></button><button data-g="Sword Battle">⚔️<b>Sword Battle</b><small>Duel pedang</small></button><button data-g="Arrow Battle">🏹<b>Arrow Battle</b><small>Serang jarak jauh</small></button><button data-g="Mini Racing">🏎️<b>Mini Racing</b><small>Balapan cepat</small></button></div><div id="picked" class="picked">Game: Couple Fighter</div><button id="start" class="primary wide">🎮 MULAI BATTLE</button><div id="lobbyStatus" class="pill">Menunggu pasangan...</div></section>
<section id="game" class="screen"><div class="top"><b id="gameTitle"></b><button id="leave">Keluar</button></div><div class="score"><div><span id="n1"></span><b id="s1">100</b></div><strong>VS</strong><div><span id="n2"></span><b id="s2">100</b></div></div><canvas id="arena"></canvas><div id="message" class="message">Bersiap...</div><div class="controls"><button data-c="left">◀</button><button data-c="right">▶</button><button data-c="jump">⬆️</button><button class="attack" data-c="attack">👊<small>ATTACK</small></button><button data-c="block">🛡️</button><button data-c="boost">🔥</button></div></section>
<section id="over" class="screen"><div class="trophy">🏆</div><h2 id="winner">HASIL</h2><p id="reason"></p><div id="final"></div><div class="row"><button id="rematch" class="primary">🔄 REMATCH</button><button id="lobbyAgain">🏠 LOBBY</button></div></section>
</main><script src="/socket.io/socket.io.js"></script><script src="/game.js"></script></body></html>
